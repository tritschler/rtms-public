[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rtms-community-plugins"
version = "1.0.0"
description = "Community security audit tools and official external plugins for RTMS Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "plugins",
    "plugins/wordpress",
    "plugins/emudhra_weak_ca",
    "plugins/php2shell",
    "plugins/vsftpd",
    "plugins/pgadmin4",
    "plugins/rancher",
    "plugins/manageengine_log360",
    "plugins/barracuda_esg",
    "plugins/sonicwall_gms",
    "plugins/glpi",
    "plugins/nexus_repository",
    "plugins/nomachine",
    "plugins/apache_ofbiz",
    "plugins/keycloak",
    "plugins/keycloak_client_mgmt",
    "plugins/openam",
    "plugins/ibm_api_connect",
    "plugins/freeswitch",
    "plugins/wordpress/wp_gravityforms",
    "plugins/wordpress/wp_naimur_email_otp",
    "plugins/wordpress/wp_registration_form_woocommerce",
    "plugins/wordpress/wp_latepoint",
    "plugins/wordpress/wp_printcart_designer",
    "plugins/wordpress/wp_payever_gateway",
    "plugins/wordpress/wp_contact_form_7",
    "plugins/openemr",
    "plugins/imgproxy",
    "plugins/sap_netweaver",
    "plugins/craft_cms",
    "plugins/redpanda_connect",
    "plugins/fortimanager",
    "plugins/ivanti_epm",
    "plugins/sharepoint",
]
testpaths = ["tests"]
