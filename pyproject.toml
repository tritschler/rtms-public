[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rtms-community-plugins"
version = "1.0.0"
description = "Community security audit tools and official external plugins for RTMS Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "plugins", "plugins/emudhra_weak_ca", "plugins/php2shell"]
testpaths = ["tests"]
